[project]
name = "segmentation"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexey Vyskubov",email = "alexey@ocaml.nl"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
]

[tool.poetry]
packages = [{include = "segmentation", from = "src"}]


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ipython = "^9.3.0"
mypy = "^1.16.0"
pylint = "^3.3.7"
pyright = "^1.1.401"
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
pytest-socket = "^0.7.0"
pytest-xdist = "^3.7.0"
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
omit = ["tests/**/*"]
